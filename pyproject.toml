[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-reliability-lab"
version = "0.1.0"
description = "Offline trace evaluation and deterministic tool replay"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [{name = "Divyansh Gupta"}]
dependencies = []

[project.urls]
Repository = "https://github.com/meridian-max/agent-reliability-lab"

[tool.setuptools.packages.find]
include = ["agent_reliability*"]
